services:
  prober:
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      ZEN_PROFILE_PATH: /zen-profile
      CODEX_CONFIG_PATH: /codex/config.toml
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - prober-data:/data
      - type: bind
        source: ${ZEN_PROFILE_SOURCE}
        target: /zen-profile
        read_only: true
      - type: bind
        source: ${CODEX_HOME_SOURCE}
        target: /codex
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  prober-data:

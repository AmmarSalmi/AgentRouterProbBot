[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrouter-availability-prober"
version = "1.0.0"
description = "Low-impact AgentRouter model availability monitor with Telegram notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
agentrouter-prober = "agentrouter_prober.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentrouter_prober = ["assets/agentrouter-account-id.png", "assets/agentrouter-dashboard-token.png"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

